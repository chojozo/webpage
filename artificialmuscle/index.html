<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArtificialMuscle 핵심 히스토리 타임라인</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

    :root {
      color-scheme: light;
      --ink: #334052;
      --muted: #8d968f;
      --paper: #ffffff;
      --line: rgba(15, 23, 42, 0.08);
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.10);
    }

    * { box-sizing: border-box; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: var(--ink);
      background: #f8fafc;
      line-height: 1.32;
    }

    main {
      width: min(100vw, 1152px);
      aspect-ratio: 16 / 4.16;
      margin: 0;
      padding: 0;
    }

    .timeline {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(226, 232, 240, 0.9);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0)),
        var(--paper);
      box-shadow: var(--shadow);
    }

    .branch-board {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 18px 28px 18px;
      background: #ffffff;
      background-size: 72px 72px;
    }

    .branch-axis {
      position: absolute;
      left: 36px;
      right: 36px;
      top: 50%;
      display: grid;
      grid-template-columns: repeat(var(--count), minmax(0, 1fr));
      height: 20px;
      transform: translateY(-50%);
      z-index: 2;
    }

    .branch-segment {
      position: relative;
      display: grid;
      place-items: center;
      margin-left: -1px;
      color: #fff;
      background: var(--accent);
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 12px 50%);
      box-shadow: 0 8px 14px rgba(80, 68, 48, 0.09);
    }

    .branch-segment:first-child {
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%);
      border-radius: 4px 0 0 4px;
    }

    .branch-segment:last-child {
      border-radius: 0 4px 4px 0;
    }

    .branch-date {
      position: absolute;
      left: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 0 4px;
      color: var(--accent);
      line-height: 1;
      white-space: nowrap;
      transform: translateX(-50%);
      z-index: 4;
    }

    .branch-date-text {
      display: block;
      color: var(--accent);
      font-size: 14px;
      font-weight: 950;
      letter-spacing: 0;
      text-shadow: 0 2px 0 rgba(255,255,255,0.5);
    }

    .bottom .branch-date {
      top: calc(50% - 49px);
    }

    .top .branch-date {
      top: calc(50% + 22px);
    }

    .branch-items {
      position: absolute;
      inset: 0 36px;
      display: grid;
      grid-template-columns: repeat(var(--count), minmax(0, 1fr));
      z-index: 3;
    }

    .branch-item {
      position: relative;
      grid-column: var(--i);
      display: grid;
      justify-items: center;
      min-width: 0;
      color: var(--accent);
      text-align: center;
      animation: rise 520ms ease both;
      animation-delay: calc(var(--i) * 45ms);
    }

    .branch-copy {
      position: absolute;
      left: 50%;
      width: min(174px, calc(100% + 58px));
      transform: translateX(-50%);
      color: #51605d;
    }

    .top .branch-copy { top: 11px; }
    .bottom .branch-copy { bottom: 12px; }

    .branch-category {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent), #ffffff 82%);
      color: var(--accent);
      font-size: 8px;
      line-height: 1.25;
      font-weight: 900;
      white-space: nowrap;
    }

    .branch-copy h2 {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 13px;
      line-height: 1.14;
      font-weight: 950;
      letter-spacing: 0;
      white-space: nowrap;
      word-break: keep-all;
    }

    .branch-copy p {
      margin: 0;
      color: rgba(30, 41, 59, 0.74);
      font-size: 10.5px;
      line-height: 1.3;
      font-weight: 760;
      word-break: keep-all;
    }

    .branch-icon {
      position: absolute;
      left: 50%;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent), white 16%);
      color: #fff;
      box-shadow:
        inset 0 0 0 6px rgba(255,255,255,0.25),
        0 12px 22px rgba(80, 68, 48, 0.14);
      transform: translateX(-50%);
    }

    .branch-icon svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .top .branch-icon { top: 57px; }
    .bottom .branch-icon { bottom: 57px; }

    .branch-stem {
      position: absolute;
      left: 50%;
      width: 3px;
      background: color-mix(in srgb, var(--accent), white 24%);
      transform: translateX(-50%);
      opacity: 0.72;
    }

    .top .branch-stem { top: 101px; height: calc(50% - 101px); }
    .bottom .branch-stem { bottom: 101px; height: calc(50% - 101px); }

    .branch-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 7px;
      height: 7px;
      border: 2px solid rgba(255,255,255,0.8);
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent), white 20%);
    }

    @media (max-width: 900px) {
      body { display: block; }
      main { width: 100%; aspect-ratio: auto; }
      .timeline { overflow: visible; }
      .branch-board {
        height: auto;
        padding: 14px;
        background: var(--paper);
      }
      .branch-axis { display: none; }
      .branch-items {
        position: relative;
        inset: auto;
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .branch-item {
        grid-column: auto;
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 12px;
        align-items: center;
        min-height: 82px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(255,255,255,0.48);
        text-align: left;
      }
      .branch-copy,
      .top .branch-copy,
      .bottom .branch-copy {
        position: static;
        width: auto;
        transform: none;
      }
      .branch-icon,
      .top .branch-icon,
      .bottom .branch-icon {
        position: static;
        transform: none;
      }
      .branch-stem,
      .branch-dot { display: none; }
      .branch-copy h2 { font-size: 16px; }
      .branch-copy p { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="timeline" aria-label="ArtificialMuscle 핵심 연혁">

      <div class="branch-board" style="--count: 7;">
        <div class="branch-axis" aria-label="ArtificialMuscle 핵심 연혁 연도">

          <div class="branch-segment" style="--accent: #0f766e;"></div>

          <div class="branch-segment" style="--accent: #0e7490;"></div>

          </article>

            <div class="branch-stem" aria-hidden="true"></div>

            <div class="branch-dot" aria-hidden="true"></div>

          <article class="branch-item top" style="--i: 4; --accent: #7c3aed;">

            </div>
            <div class="branch-date"><span class="branch-date-text">2026-05</span></div>
            <div class="branch-stem" aria-hidden="true"></div>
            <div class="branch-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 8h14M6 16h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
            <div class="branch-dot" aria-hidden="true"></div>

          <article class="branch-item bottom" style="--i: 5; --accent: #0e7490;">

            <div class="branch-dot" aria-hidden="true"></div>
          </article>
          <article class="branch-item top" style="--i: 6; --accent: #334155;">
            <div class="branch-copy">
              <h2>글로벌협력 탈락</h2>
              <p>AI 탑재 극세사 인공근육 탈락</p>
            </div>
            <div class="branch-date"><span class="branch-date-text">2026-06</span></div>
            <div class="branch-stem" aria-hidden="true"></div>
            <div class="branch-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 8h14M6 16h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
            <div class="branch-dot" aria-hidden="true"></div>

            <div class="branch-copy">
              <h2>장비 설계 미팅</h2>
              <p>코일 섬유 장비 세부 조건 협의</p>
            </div>
            <div class="branch-date"><span class="branch-date-text">2026-07</span></div>
            <div class="branch-stem" aria-hidden="true"></div>
            <div class="branch-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16l6-6 4 4-6 6H4zM13 7l4-4 4 4-4 4zM14 14l4 4M16 12l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="branch-dot" aria-hidden="true"></div>

        </div>
      </div>
    </section>
  </main>
</body>
</html>
